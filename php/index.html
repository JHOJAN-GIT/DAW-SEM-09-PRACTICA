<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 09 - PHP Backend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Formulario PHP</h2>
            <p class="subtitle">Validación estricta en servidor</p>
            
            <form action="procesar.php" method="POST" novalidate>
                <div class="input-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Ej. Jhojan Pérez">
                </div>
                
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                
                <button type="submit" class="btn">Procesar Datos</button>
            </form>
        </div>
    </div>
</body>
</html>
